[workspace]
members = [
  "bindings/node",
  "bindings/web",
  "crates/engine",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
turbo-engine = { path = "crates/engine" }
napi = { version = "3.0.0", features = ["napi10"] }
napi-build = "2"
napi-derive = "3.0.0"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
