name: CI

"on":
  push:
    branches:
      - main
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test shared engine
        run: cargo test -p turbo-engine
      - name: Check WebAssembly target
        run: cargo check -p turbo-web-binding --target wasm32-unknown-unknown

  native:
    name: Native binding - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native binding
        run: pnpm --filter @turbo-napi/node build --target ${{ matrix.target }}
      - name: Test native binding
        working-directory: bindings/node
        run: node -e "const math = require('./index.js'); if (math.add(8, 2) !== 10 || math.subtract(8, 2) !== 6 || math.multiply(8, 2) !== 16 || math.divide(8, 2) !== 4) process.exit(1)"

  web-and-api:
    name: WebAssembly and common API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Test common Node API
        working-directory: packages/api
        run: node --input-type=module -e "import { createMathApi } from './dist/node.mjs'; const math = await createMathApi(); if (math.add(8, 2) !== 10 || math.subtract(8, 2) !== 6 || math.multiply(8, 2) !== 16 || math.divide(8, 2) !== 4) process.exit(1)"
